version: '3.8'

services:
  promptvault:
    build: .
    container_name: promptvault-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./firebase-applet-config.json:/app/firebase-applet-config.json:ro
